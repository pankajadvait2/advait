name: Terraform_Pipeline

on: 
  push:
    branches:
      - "feature/new-yml-code-new"
  pull_request:
    branches:
      - main

permissions: 
  contents: read
  id-token: write

jobs:
  Terraform-validate:
    name: terraform validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./environment/parent

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup terraform
        uses: hashicorp/setup-terraform@v2.0.3
#azure login
      - name: Azure Login
        uses: azure/login@v2
        with:
           client-id: ${{ secrets.AZURE_CLIENT_ID }}
           tenant-id: ${{ secrets.AZURE_TENANT_ID }}
           subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: terraform Formatting
        run: terraform fmt

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan